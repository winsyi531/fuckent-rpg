// ================= 像素繪圖工具 =================
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function hex(c){const n=parseInt(c.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function painter(w,h,fn,opt={}){
  const c=mk(w,h),g=c.getContext('2d');
  const a={g,
    R:(x,y,ww,hh,col)=>{g.fillStyle=col;g.fillRect(x,y,ww,hh)},
    P:(x,y,col)=>{g.fillStyle=col;g.fillRect(x,y,1,1)},
    E:(cx,cy,rx,ry,col)=>{g.fillStyle=col;for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)g.fillRect(x,y,1,1)}},
    L:(x0,y0,x1,y1,col,t=1)=>{g.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))||1;for(let i=0;i<=n;i++){const x=Math.round(x0+(x1-x0)*i/n),y=Math.round(y0+(y1-y0)*i/n);g.fillRect(x-Math.floor(t/2),y-Math.floor(t/2),t,t)}},
  };
  a.C=(cx,cy,r,col)=>a.E(cx,cy,r,r,col);
  fn(a);
  if(opt.shade!==false)shade(c);
  if(opt.outline!==false)outline(c,opt.outline||'#1c1630');
  return c;
}
function outline(c,col){const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h),A=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)A[i]=d.data[i*4+3]>0?1:0;const[r,gg,b]=hex(col);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(A[i])continue;
    if((x>0&&A[i-1])||(x<w-1&&A[i+1])||(y>0&&A[i-w])||(y<h-1&&A[i+w])){const k=i*4;d.data[k]=r;d.data[k+1]=gg;d.data[k+2]=b;d.data[k+3]=255}}
  g.putImageData(d,0,0)}
function shade(c){const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h),A=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)A[i]=d.data[i*4+3]>0?1:0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!A[i])continue;

let AC=null,muted=false;
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function tone(f,d,type='square',vol=.04,when=0,f2){if(!AC||muted)return;const t=AC.currentTime+when;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={
  blip:()=>tone(1200,.03,'square',.02),sel:()=>tone(880,.06),bump:()=>tone(90,.08,'square',.05),door:()=>{tone(300,.08);tone(200,.1,'square',.04,.08)},
  hit:()=>{tone(220,.12,'sawtooth',.07,0,60)},super:()=>{tone(400,.08,'sawtooth',.07,0,100);tone(150,.18,'sawtooth',.07,.08,40)},weak:()=>tone(160,.12,'triangle',.07,0,90),
  faint:()=>tone(600,.6,'square',.05,0,60),stat:up=>{for(let i=0;i<5;i++)tone(up?400+i*120:900-i*120,.06,'square',.03,i*.05)},

// ================= 文字/對話/選單 =================
function wrapText(s,maxW,size){ctx.font=`700 ${size}px ${FONT}`;const out=[];
  for(const para of s.split('\n')){let cur='';for(const ch of para){const t=cur+ch;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=ch}else cur=t}out.push(cur)}return out}
function say(s,opt={}){s=s.split('{N}').join(G.name);const lines=wrapText(s,mode==='battle'?440:436,16);const pages=[];
  for(let i=0;i<lines.length;i+=2)pages.push(lines.slice(i,i+2));
  return new Promise(res=>{UI.dlg={pages,page:0,chars:0,res,wait:opt.wait||0,t:0,keep:opt.keep,done:false}})}
function pageLen(d){return d.pages[d.page].join('').length}
function updDlg(){const d=UI.dlg;if(!d||d.done)return;const L=pageLen(d);
  if(d.chars<L){d.chars=Math.min(L,d.chars+1.6);if(frame%3===0)SFX.blip();return}
  if(d.page===d.pages.length-1&&d.keep){d.done=true;d.res();return}
  if(d.wait){d.t+=16.7;if(d.t>=d.wait)advDlg()}}
function advDlg(){const d=UI.dlg;if(!d||d.done)return;
  if(d.chars<pageLen(d)){d.chars=pageLen(d);return}
  if(d.page<d.pages.length-1){d.page++;d.chars=0;d.t=0;return}
  UI.dlg=null;d.res()}
function choose(opts,o={}){return new Promise(res=>{UI.menu=Object.assign({x:160,y:60,w:76,cols:1,cancel:true,rowH:15,style:'light'},o,{opts,idx:o.idx||0,res});if(o.onMove)o.onMove(UI.menu.idx)})}
function handleMenu(b){const m=UI.menu,n=m.opts.length;let i=m.idx;
  if(b==='up')i-=m.cols;else if(b==='down')i+=m.cols;else if(b==='left'&&m.cols>1&&i%m.cols>0)i--;else if(b==='right'&&m.cols>1&&i%m.cols<m.cols-1)i++;
  else if(b==='a'||b==='start'){SFX.sel();UI.menu=null;m.res(m.idx);return}
  else if(b==='b'&&m.cancel){SFX.sel();UI.menu=null;m.res(-1);return}
  if(i>=0&&i<n&&i!==m.idx){m.idx=i;SFX.blip();if(m.onMove)m.onMove(i)}}

const held={};const pressQ=[];
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right',z:'a',Z:'a',' ':'a',j:'a',x:'b',X:'b',k:'b',Escape:'b',Backspace:'b',Enter:'start'};
function press(b){initAudio();
  if(UI.menu){handleMenu(b);return}
  if(UI.dlg){if(!UI.dlg.done&&(b==='a'||b==='b'||b==='start'))advDlg();return}
  pressQ.push(b);if(pressQ.length>3)pressQ.shift()}
addEventListener('keydown',e=>{if(document.activeElement&&document.activeElement.tagName==='INPUT')return;const b=KEYMAP[e.key];if(!b)return;e.preventDefault();
  if(e.repeat){if(UI.menu&&['up','down','left','right'].includes(b))handleMenu(b);held[b]=true;return}held[b]=true;press(b)});
addEventListener('keyup',e=>{const b=KEYMAP[e.key];if(b)held[b]=false});
addEventListener('blur',()=>{for(const k in held)held[k]=false});
document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;
  el.addEventListener('pointerdown',e=>{e.preventDefault();held[k]=true;press(k)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>held[k]=false))});
function heldDir(){for(const d of['up','down','left','right'])if(held[d])return d;return null}

const stageMul=s=>s>=0?(2+s)/2:2/(2-s);
function calcDmg(u,t,M,su,st){const A=u.atk*stageMul(su.atk),D=t.def*stageMul(st.def);
  let d=((2*u.lvl/5+2)*M.pow*A/D)/50+2;if(SP[u.sp].type===M.type)d*=1.5;const eff=typeEff(M.type,SP[t.sp].type);d*=eff;
  const crit=Math.random()<1/16;if(crit)d*=1.5;d*=.85+Math.random()*.15;return{d:Math.max(1,Math.floor(d)),eff,crit}}

  SFX.encounter();

  await fadeOut(200);mode='battle';if(wild){B.eVis=true;B.dispE=wild.hp}await fadeIn(150);
  await tween(600,p=>B.slide=1-p);B.slide=0;
  if(wild){B.showE=true;if(opt.rare){SFX.jingle();B.sparkle=true;await say(`哇！是稀有的 ${nm(B.e)}！`)}await say(`野生的 ${nm(B.e)} 跳出來了！`)}
  else{await say(`${tr.name} 想要對戰！`);await tween(300,p=>B.trX=p*120);B.trSpr=null;await sendEnemy(B.e)}
  await tween(300,p=>B.plX=p*140);B.plSpr=null;
  await sendAlly(G.party.find(m=>m.hp>0));
  while(true){
    UI.bprompt=`要讓 ${nm(B.a)}\n做什麼？`;
    const c=await choose(['戰鬥','背包','隊伍','逃跑'],{x:124,y:112,w:116,h:48,cols:2,cancel:false,rowH:18,ytop:9});
